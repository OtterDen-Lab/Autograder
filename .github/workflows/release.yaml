name: Release on version tag

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python for version check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load LMS source pin
        id: lms_source
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("scripts/lms_release_source.toml").read_text())
          section = data.get("lms_interface", {})
          repository = str(section.get("repository", "")).strip()
          ref = str(section.get("ref", "")).strip()
          expected_version = str(section.get("expected_version", "")).strip()

          if not repository:
            raise SystemExit("Missing lms_interface.repository in scripts/lms_release_source.toml")
          if not ref:
            raise SystemExit("Missing lms_interface.ref in scripts/lms_release_source.toml")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"repository={repository}\n")
            output.write(f"ref={ref}\n")
            output.write(f"expected_version={expected_version}\n")
          PY

      - name: Checkout pinned LMSInterface source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.lms_source.outputs.repository }}
          ref: ${{ steps.lms_source.outputs.ref }}
          path: .lmsinterface-src

      - name: Vendor LMSInterface from pinned source
        run: python scripts/vendor_lms_interface.py --quiet --lms-path .lmsinterface-src

      - name: Verify vendored LMS version
        if: steps.lms_source.outputs.expected_version != ''
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          expected_version = "${{ steps.lms_source.outputs.expected_version }}"
          init_text = Path("lms_interface/__init__.py").read_text()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          if not match:
            raise SystemExit("Could not find __version__ in lms_interface/__init__.py")

          actual_version = match.group(1)
          print(f"Vendored LMS version: {actual_version}")
          print(f"Expected LMS version: {expected_version}")
          if actual_version != expected_version:
            raise SystemExit(
              f"Vendored LMS version mismatch ({actual_version} != {expected_version})"
            )
          PY

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(python -c "import tomllib, pathlib; d = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print(d['project']['version'])")
          EXPECTED_TAG="v${VERSION}"

          echo "Tag from event:   ${TAG}"
          echo "Version in file:  ${VERSION}"
          echo "Expected tag:     ${EXPECTED_TAG}"

          if [ "${TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Tag does not match pyproject.toml version."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.13 for build
        run: uv python install 3.13

      - name: Build
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            - Built with uv and published to PyPI.
            - Artifacts attached below.
          files: dist/*
