name: Release on version bump

on:
  push:
    branches:
      - main    # change if your default branch is different
  workflow_dispatch:
    inputs:
      force:
        description: "Force release of current version (skip version-change check)"
        required: false
        default: "false"

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: write   # create tags & releases
      id-token: write   # PyPI trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need history to read previous version

      - name: Set up Python for tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get previous version (from parent commit)
        id: prev_version
        run: |
          # For workflow_dispatch there may be no "before", so just leave empty
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            if git show ${{ github.event.before }}:pyproject.toml > pyproject_prev.toml 2>/dev/null; then
              VERSION=$(python - << 'PY'
import tomllib
from pathlib import Path
data = tomllib.loads(Path("pyproject_prev.toml").read_text())
print(data["project"]["version"])
PY
)
              echo "previous version: $VERSION"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "No previous pyproject.toml found; treating as first version."
              echo "version=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Get current version
        id: curr_version
        run: |
          VERSION=$(python - << 'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )
          echo "current version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether this is a release commit
        id: decision
        run: |
          PREV="${{ steps.prev_version.outputs.version }}"
          CURR="${{ steps.curr_version.outputs.version }}"
          MSG="${{ github.event.head_commit.message }}"
          EVENT="${{ github.event_name }}"
          FORCE_INPUT="${{ github.event.inputs.force }}"

          echo "Event:            '$EVENT'"
          echo "Previous version: '$PREV'"
          echo "Current version:  '$CURR'"
          echo "Commit message:   '$MSG'"
          echo "Force input:      '$FORCE_INPUT'"

          SHOULD_RELEASE=false

          # 1) Manual force via workflow_dispatch
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE_INPUT" = "true" ]; then
            echo "Manual workflow_dispatch with force=true; forcing release."
            SHOULD_RELEASE=true

          # 2) Normal path: push to main, version changed, and commit message contains 'release'
          elif [ "$EVENT" = "push" ]; then
            if [ -n "$CURR" ] && [ "$CURR" != "$PREV" ]; then
              if echo "$MSG" | grep -qi "release"; then
                echo "Version changed and commit message indicates release."
                SHOULD_RELEASE=true
              else
                echo "Version changed but commit message does not contain 'release'; not releasing."
              fi
            else
              echo "Version did not change; not releasing."
            fi
          else
            echo "No release conditions met."
          fi

          echo "release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Stop if not a release
        if: steps.decision.outputs.release != 'true'
        run: |
          echo "Not a release run; skipping remaining steps."
          exit 0

      - name: Ensure tag does not already exist
        if: steps.decision.outputs.release == 'true'
        run: |
          VERSION="${{ steps.curr_version.outputs.version }}"
          TAG="v${VERSION}"

          echo "Checking for existing tag $TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Aborting."
            exit 1
          fi

      - name: Create and push tag
        if: steps.decision.outputs.release == 'true'
        run: |
          VERSION="${{ steps.curr_version.outputs.version }}"
          TAG="v${VERSION}"

          echo "Creating tag $TAG at $GITHUB_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Install uv
        if: steps.decision.outputs.release == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.13 for build
        if: steps.decision.outputs.release == 'true'
        run: uv python install 3.13

      - name: Build
        if: steps.decision.outputs.release == 'true'
        run: uv build

      - name: Upload dist artifacts
        if: steps.decision.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        if: steps.decision.outputs.release == 'true'
        run: uv publish

      - name: Create GitHub Release
        if: steps.decision.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.curr_version.outputs.version }}
          name: v${{ steps.curr_version.outputs.version }}
          body: |
            Release v${{ steps.curr_version.outputs.version }}

            - Version bumped in pyproject.toml
            - Built with uv and published to PyPI.
            - Artifacts attached below.
          files: dist/*
