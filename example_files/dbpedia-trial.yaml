prod: true
push: true

assignment_types:
  dbpedia_trial:
    kind: ProgrammingAssignment
    grader: dbpedia-trial-grader
    settings:
      base_image_name: "quay.io/jupyter/pytorch-notebook:cuda12-latest"
      source_repo: "https://github.com/CSUMB-SCD-assignments/CST463-fall2026-base"
      branch: "base"
      container_repo_path: "/repo/programming-assignments"
      student_code_path: "student_code.py"
      dataset_cache_host_path: "/home/ssogden/datasets/CST463-PA4"
      dataset_cache_container_path: "/data/huggingface"
      # Three model initializations share the same train/development split.
      # The seed column in metrics.csv identifies each individual learning curve.
      epochs: 10
      model_seeds: [0, 1, 2]
      trial_batch_size: 128
      max_batch_size: 1024
      loader_num_workers: 8
      seed: 0
      gpu_count: 1
      command_timeout_seconds: 1800
      network_disabled: true
      memory_limit: null
      nano_cpus: null
      pids_limit: 1024
      shm_size: "2g"

courses:
  - id: 33852
    name: "CST463"
    assignment_groups:
      - type: dbpedia_trial
        settings:
          file_paths:
            '.*student_code.*\.py':
              path: "student_code.py"
            '.*benchmark[-_]?config.*\.ya?ml':
              path: "benchmark-config.yaml"
        assignments:
          - id: 657618
            repo_path: "PA4"
