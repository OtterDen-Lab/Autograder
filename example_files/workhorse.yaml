prod: False
push: False

# Define assignment types with default graders and settings
assignment_types:
  programming:
    kind: ProgrammingAssignment
    grader: template-grader
    settings:
      record_retention: true

  text:
    kind: TextAssignment
    grader: TextSubmissionGrader
    settings:
      grade_after_lock_date: true
      prefer_anthropic: true

courses:
  - name: CST334
    id: 29978
    slack_channel: C09HR2J5EBF

    assignment_groups:
      - name: Programming Assignments
        type: programming
        settings:
          base_image_name: "samogden/cst334"
          extra_install_lines:
            - "RUN apt install clang"
          source_repo: "https://github.com/CSUMB-SCD-instructors/CST334"
          golden_repo: "https://github.com/CSUMB-SCD-instructors/CST334-golden"
          files_from_golden:
            - "tests/unittests_reserved.c"
          student_code_path: "src"
          num_repeats: 10
        file_paths:
          '.*student_code.*\.c':
            path: "src" # subdir within assignment folder
            name: "student_code.c" # target filename, will force to change into this
          '.*student_code.*\.h':
            path: "include" # subdir within assignment folder
            name: "student_code.h" # target filename, will force to change into this
        assignments:
          - {id: 506889, repo_path: PA1}
