prod: true
push: true
privacy_mode: id_only

reporting:
  slack_channel: C0AAD94FX5K
  notify_on: failures #all

# Define assignment types with default graders and settings
assignment_types:
  programming:
    kind: ProgrammingAssignment
    grader: template-grader
    schedule:
      timezone: America/Los_Angeles
      rrule: "FREQ=DAILY;BYHOUR=0,12;BYMINUTE=0;BYSECOND=0"
    settings:
      record_retention: true
      records_dir: "~/autograder-records/workhorse"

  weekly-study-notes:
    kind: TextAssignment
    grader: TextSubmissionGrader
    schedule:
      timezone: America/Los_Angeles
      rrule: "FREQ=WEEKLY;BYDAY=SU;BYHOUR=0;BYMINUTE=0;BYSECOND=0"
    settings:
      # Text grading uses its built-in scoring defaults.
      # Add an explicit rubric block here only if the Canvas assignment has
      # an attached rubric and you want rubric assessment pushed back to LMS.
      grade_after_lock_date: true
      prefer_anthropic: true
      # Model tier settings (small, medium, large)
      phase1_tier: medium    # Aggregate analysis
      phase2_tier: medium    # Individual grading
      phase25_tier: medium   # Question consolidation

  weekly-study-notes-online:
    kind: TextAssignment
    grader: TextSubmissionGrader
    schedule:
      timezone: America/Los_Angeles
      rrule: "FREQ=WEEKLY;BYDAY=MO;BYHOUR=2;BYMINUTE=0;BYSECOND=0"
    settings:
      # Text grading uses its built-in scoring defaults.
      # Add an explicit rubric block here only if the Canvas assignment has
      # an attached rubric and you want rubric assessment pushed back to LMS.
      grade_after_lock_date: true
      prefer_anthropic: true
      # Model tier settings (small, medium, large)
      phase1_tier: medium    # Aggregate analysis
      phase2_tier: medium    # Individual grading
      phase25_tier: medium   # Question consolidation

  panopto_watch:
    kind: ExternalToolAssignment
    grader: panopto-watch-grader
    schedule:
      timezone: America/Los_Angeles
      rrule: "FREQ=MINUTELY;INTERVAL=5"
    settings:
      panopto_base: "https://csumb.hosted.panopto.com/"
      panopto_refresh_token_path: "~/.autograder/panopto_refresh_token.json"
      canvas_user_attribute: "sis_user_id"
      external_user_attribute: "username"
      record_identifier_paths:
        - "User.Username"
      record_percent_paths:
        - "PercentCompleted"
      record_viewed_seconds_paths:
        - "MostRecentViewPositionInSeconds"
      allow_late_penalty: false

