prod: true
push: true
privacy_mode: id_only

reporting:
  slack_channel: C0AAD94FX5K
  notify_on: failures #all

# Define assignment types with default graders and settings
assignment_types:
  programming:
    kind: ProgrammingAssignment
    grader: template-grader
    settings:
      record_retention: true
      records_dir: "~/autograder-records/workhorse"

  text:
    kind: TextAssignment
    grader: TextSubmissionGrader
    settings:
      grade_after_lock_date: true
      prefer_anthropic: true
      # Model tier settings (small, medium, large)
      phase1_tier: medium    # Aggregate analysis
      phase2_tier: medium    # Individual grading
      phase25_tier: medium   # Question consolidation

courses:
  - name: CST334
    id: 31580
    slack_channel: C09HR2J5EBF

    assignment_groups:
      - name: Programming Assignments
        type: programming
        settings:
          base_image_name: "samogden/cst334"
          source_repo: "https://github.com/CSUMB-SCD-instructors/CST334"
          golden_repo: "https://github.com/CSUMB-SCD-instructors/CST334-golden"
          files_from_golden:
            - "tests/unittests_reserved.c"
          student_code_path: "src"
          num_repeats: 10
        file_paths:
          '.*student_code.*\.c':
            path: "src/student_code.c" # target filename, will force to change into this
          '.*student_code.*\.h':
            path: "include/student_code.h" # target filename, will force to change into this
        assignments:
          - {id: 553736, repo_path: PA1}
          - {id: 553737, repo_path: PA2}
          - {id: 553738, repo_path: PA3}
          - {id: 553739, repo_path: PA4}
          - {id: 553740, repo_path: PA5}
          - {id: 553741, repo_path: PA6}

      - name: Learning Logs
        type: text
