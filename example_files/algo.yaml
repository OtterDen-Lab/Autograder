prod: True
push: False

# Define assignment types with default graders and settings
assignment_types:
  programming:
    kind: ProgrammingAssignment
    grader: template-grader
    settings:
      record_retention: true

courses:
  - name: CST370
    id: 29978

    assignment_groups:
      - name: Programming Assignments
        type: programming
        settings:
          base_image_name: "samogden/cst334"
          source_repo: "https://github.com/ImagineWagons8487/CST370_AutoGrader"

        extra_dockerfile_lines:
          - "ENV DEBIAN_FRONTEND=noninteractive"
          - "RUN apt update -y"
          - "RUN apt install -y clang"
          - "RUN apt install -y openjdk-21-jdk"
          - "RUN apt install -y make"

        student_code_path: "src"

        file_paths:
          '.*_1.*\.java':
            path: "" # subdir within assignment folder
            name: "hw3_1.java" # target filename, will force to change into this
          '.*_2.*\.java':
            path: ""
            name: "hw3_2.java"
          '.*_1.*\.cpp':
            path: ""
            name: "hw3_1.cpp"
          '.*_2.*\.cpp':
            path: ""
            name: "hw3_2.cpp"

        assignments:
          - id: 506889
            repo_path: HW3