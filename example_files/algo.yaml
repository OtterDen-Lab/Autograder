prod: False
push: False

# Define assignment types with default graders and settings
assignment_types:
  programming:
    kind: ProgrammingAssignment
    grader: template-grader
    settings:
      record_retention: true
      records_dir: "./records/algo"

courses:
  - name: CST370
    id: 29324

    assignment_groups:
      - name: Programming Assignments
        type: programming
        settings:
          base_image_name: "samogden/cst334"
          source_repo: https://github.com/ImagineWagons8487/CST370_AutoGrader
        
        extra_dockerfile_lines:
          - "RUN apt update -y && apt install clang -y && apt install openjdk-21-jdk -y && apt install make -y"

        student_code_path: "src"
        
        file_paths:
          '.*_1.*\.java':
            path: "hw3_1_grading/src" # subdir within assignment folder
            name: "hw3_1.java" # target filename, will force to change into this
          '.*_2.*\.java':
            path: "hw3_2_grading/src"
            name: "hw3_2.java"
          '.*_1.*\.cpp':
            path: "hw3_1_grading/src"
            name: "hw3_1.cpp"
          '.*_2.*\.cpp':
            path: "hw3_2_grading/src"
            name: "hw3_2.cpp"
        
        assignments:
          - id: 480061
            assignment_name: HW3
            repo_path: HW3
