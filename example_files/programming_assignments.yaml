prod: False
push: False

courses:

  - name: CST334
    id: 29978
    # Course-level defaults
    grader: CST334
    assignment_defaults:
      kind: ProgrammingAssignment
      kwargs:
        num_repeats: 10
        golden_base_dir: "~/repos/classes/CST334-golden/programming-assignments"
        files_from_golden_repo:
          - "tests/unittests_reserved.c"
    assignments:
      - repo_path: PA1
        id: 506889
      - repo_path: PA2
        id: 506890
      - repo_path: PA3
        id: 506891
      - repo_path: PA4
        id: 506892
      - repo_path: PA5
        id: 506893
      - repo_path: PA6
        id: 506894

  - name: CST463
    id: 29740
    # Course-level defaults
    grader: docker-configurable
    assignment_defaults:
      kind: ProgrammingAssignment
      assignment_kwargs:
        allowed_filenames:
          - "student_code.py"
      kwargs:
        num_repeats: 10
        working_dir: "/tmp/grading/programming-assignments/PA1"
        grading_script: "uv sync && uv run python ../run_tests.py PA1 --output /tmp/results.yaml"
        base_image: "python:3.13-slim"
#        canvas_points: 50  # Convert local scores to Canvas points (assignment worth 70 pts)
        additional_installs:
          - "apt-get update && apt-get install -y git"
          - "python -m ensurepip --upgrade"
          - "python -m pip install --root-user-action=ignore uv"
          - "git clone https://github.com/CSUMB-SCD-instructors/CST463 /tmp/grading/"
    assignments:
      - repo_path: PA1
        id: 527811