[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Autograder"
version = "0.1.0"
description = "A collection of tools for teaching and grading"
authors = [
    {name = "Sam Ogden", email = "samuel.s.ogden@gmail.com"},
]
requires-python = ">=3.12"


dependencies = [
    "python-dotenv==1.0.1",
    "PyYAML==6.0.1",
    "requests==2.32.2",
    "pandas",
    "fuzzywuzzy",
    "python-Levenshtein>=0.21.0",
    "colorama",
    "docker>=6.1.3",
    "pymupdf",
    "slack-sdk>=3.36.0",
    "scikit-learn",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "pyzbar>=0.1.9",
    "opencv-python>=4.8.0",
    "openai",
    "anthropic",
    "ollama>=0.6.0",
    "canvasapi>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "httpx>=0.25.2",
]

[project.urls]
homepage = "https://github.com/OtterDen-Lab/Autograder"
repository = "https://github.com/OtterDen-Lab/Autograder"

[project.scripts]
grade-assignments = "Autograder.grade_assignments:main"


[tool.hatch.build.targets.wheel]
packages = ["Autograder", "WebUI"]

[tool.hatch.metadata]
allow-direct-references = true
