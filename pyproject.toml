[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Autograder"
version = "0.1.0"
description = "A collection of tools for teaching and grading"
authors = [
    {name = "Sam Ogden", email = "samuel.s.ogden@gmail.com"},
]
requires-python = ">=3.12"


dependencies = [
    "Jinja2==3.1.3",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.1",
    "requests==2.32.2",
    "pandas",
    "pypandoc~=1.6.3",
    "pytablewriter~=1.2.0",
    "openai",
    "fuzzywuzzy",
    "colorama",
    "anthropic",
    "pylatex>=1.4.2",
    "docker>=6.1.3",
    "pymupdf",
    "lms-interface",
    "slack-sdk>=3.36.0",
    "scikit-learn",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "pillow>=10.0.0",
    "pyzbar>=0.1.9",
    "cryptography>=41.0.0",
    "aiosqlite>=0.19.0",
]

[tool.uv.sources]
lms-interface = { path = "../LMSInterface" }

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["Autograder"]

[tool.hatch.metadata]
allow-direct-references = true
