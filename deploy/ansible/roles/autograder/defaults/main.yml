---
autograder_user: grader
autograder_group: "{{ autograder_user }}"
autograder_home: "/home/{{ autograder_user }}"
autograder_command: "{{ autograder_home }}/.local/bin/grade-assignments"
autograder_uv_command: "{{ autograder_home }}/.local/bin/uv"
autograder_package: Otter-Autograder==0.15.9
autograder_config_file: "{{ autograder_home }}/.config/otter-autograder/grading.yaml"
autograder_env_file: "{{ autograder_home }}/.tokens/autograder.env"
autograder_wrapper_path: /usr/local/libexec/autograder-run
autograder_log_dir: /var/log/grading

# Set this to a directory in the calling playbook, for example
# "{{ playbook_dir }}/files". All YAML fragments in that directory are copied
# together, keeping relative `includes` paths valid on the target host.
autograder_config_source_dir: ""

# Install the released package into uv's isolated tool environment. Change the
# version here (or in inventory) to deploy an update deliberately.
autograder_manage_uv: true
autograder_uv_installer_url: https://astral.sh/uv/install.sh

# Docker containers are capped separately by AUTOGRADER_DOCKER_MEMORY_LIMIT in
# autograder_env_file. Keep this aligned with VM capacity and worker count.
autograder_max_workers: 2
autograder_timeout_start_sec: 45min
autograder_timer_on_calendar: '*:0/15'
autograder_timer_accuracy_sec: 1min

# Set to false for hosts where the account is granted Docker access another way.
autograder_manage_docker_group: true
autograder_docker_group: docker
